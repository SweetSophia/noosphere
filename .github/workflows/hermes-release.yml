name: Publish Hermes plugin bundle

on:
  push:
    tags: ["v-hermes-*"]

permissions:
  contents: write

jobs:
  package-hermes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate release version metadata
        run: |
          npm run version:check
          version=$(cat VERSION)
          plugin_version=$(sed -n 's/^version:[[:space:]]*//p' hermes-noosphere-memory/plugins/memory/noosphere/plugin.yaml)
          if [[ "$plugin_version" != "$version" ]]; then
            printf 'Hermes plugin version %s does not match VERSION=%s\n' "$plugin_version" "$version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v-hermes-* && "$GITHUB_REF_NAME" != "v-hermes-${version}" ]]; then
            printf 'Hermes release tag %s does not match VERSION=%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi

      - name: Test Hermes provider
        run: |
          python3 -m unittest discover -s hermes-noosphere-memory/tests
          python3 -m compileall -q hermes-noosphere-memory/plugins/memory/noosphere

      - name: Build deterministic Hermes bundle
        run: |
          scripts/package-hermes-plugin.sh dist
          version=$(cat VERSION)
          archive="dist/hermes-noosphere-memory-${version}.tar.gz"
          sha256sum --check "${archive}.sha256"
          tar -tzf "$archive" >/dev/null

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermes-noosphere-memory-${{ github.ref_name }}
          path: |
            dist/hermes-noosphere-memory-*.tar.gz
            dist/hermes-noosphere-memory-*.tar.gz.sha256
          if-no-files-found: error

      - name: Attach bundle to coordinated GitHub release
        if: startsWith(github.ref, 'refs/tags/v-hermes-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v-hermes-}
          release_tag="v${version}"
          gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null || {
            printf 'Create the coordinated %s GitHub release before pushing %s.\n' "$release_tag" "$GITHUB_REF_NAME" >&2
            exit 1
          }
          for asset in \
            "dist/hermes-noosphere-memory-${version}.tar.gz" \
            "dist/hermes-noosphere-memory-${version}.tar.gz.sha256"; do
            asset_name=$(basename "$asset")
            existing_dir="/tmp/existing-${asset_name}"
            mkdir -p "$existing_dir"
            if gh release download "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset_name" \
              --dir "$existing_dir" >/dev/null 2>&1; then
              cmp "$asset" "$existing_dir/$asset_name" || {
                printf 'refusing to replace non-identical release asset: %s\n' "$asset_name" >&2
                exit 1
              }
              printf 'Existing release asset is byte-identical: %s\n' "$asset_name"
            else
              gh release upload "$release_tag" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done
