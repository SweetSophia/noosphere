name: Publish Noosphere plugins to npm

on:
  pull_request:
    paths:
      - ".github/workflows/npm-publish.yml"
      - "VERSION"
      - "scripts/check-package-policies.mjs"
      - "scripts/sync-version.mjs"
      - "scripts/verify-npm-publication-integrity.sh"
      - "scripts/test-npm-publication-integrity.sh"
      - "scripts/publish-npm-artifact.sh"
      - "scripts/test-npm-artifact-publication.sh"
      - "scripts/npm-publication-workflow.test.mjs"
      - "vendor/toml5-candidate/pack-adapter.mjs"
      - "vendor/toml5-candidate/public-consumers.mjs"
      - "vendor/toml5-candidate/consumer-fixtures/**"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "install-openclaw.sh"
      - "docker-compose.noosphere.yml"
      - "README.md"
      - "docs/OPENCLAW*.md"
      - "hermes-noosphere-memory/plugins/memory/noosphere/plugin.yaml"
      - "noosphere-injected-memory/**"
      # Shared library consumed as a bundled dep by opencode/kilocode: a change
      # here must re-run their package-check (typecheck/build/committed dist).
      - "noosphere-client/**"
      - "openclaw-noosphere-memory/**"
      - "opencode-noosphere-memory/**"
      - "kilocode-noosphere-memory/**"
      - "noosphere-mcp/**"
  push:
    tags: ["v-openclaw-*", "v-opencode-*", "v-kilocode-*", "v-mcp-*"]
  workflow_dispatch:
    inputs:
      publish_openclaw:
        description: "Publish the OpenClaw plugin (@sweetsophia/openclaw-noosphere-memory) to npm"
        required: true
        type: boolean
        default: false
      publish_opencode:
        description: "Publish the Opencode plugin (@sweetsophia/opencode-noosphere-memory) to npm"
        required: true
        type: boolean
        default: false
      publish_kilocode:
        description: "Publish the Kilo Code plugin (@sweetsophia/kilocode-noosphere-memory) to npm"
        required: true
        type: boolean
        default: false
      publish_mcp:
        description: "Publish the MCP server (@sweetsophia/noosphere-mcp) to npm"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  package-check:
    strategy:
      fail-fast: false
      matrix:
        package:
          - dir: noosphere-injected-memory
            name: "@sweetsophia/noosphere-injected-memory"
          - dir: openclaw-noosphere-memory
            name: "@sweetsophia/openclaw-noosphere-memory"
          - dir: opencode-noosphere-memory
            name: "@sweetsophia/opencode-noosphere-memory"
          - dir: kilocode-noosphere-memory
            name: "@sweetsophia/kilocode-noosphere-memory"
          - dir: noosphere-mcp
            name: "@sweetsophia/noosphere-mcp"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ${{ matrix.package.dir }}/package-lock.json

      - name: Validate release version metadata
        working-directory: .
        run: npm run version:check

      - name: Validate package publishing policy
        working-directory: .
        run: npm run package-policy:check

      - name: Install dependencies
        run: npm ci

      - name: Test package when available
        run: npm run test --if-present

      - name: Audit package dependencies
        run: npm audit --audit-level=low

      - name: Validate package metadata
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const lockVersion = lock.packages?.[""]?.version ?? lock.version;

          if (lockVersion !== pkg.version) {
            console.error(
              `package-lock.json version (${lockVersion}) does not match package.json version (${pkg.version})`
            );
            process.exit(1);
          }
          NODE

      - name: Type-check
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Verify committed dist is current
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Pack adapters with the bundled private client
        if: matrix.package.dir == 'opencode-noosphere-memory' || matrix.package.dir == 'kilocode-noosphere-memory'
        run: node ../vendor/toml5-candidate/pack-adapter.mjs "$PWD" "$RUNNER_TEMP/adapter-package"

      - name: Qualify the installed adapter tarball
        if: matrix.package.dir == 'opencode-noosphere-memory' || matrix.package.dir == 'kilocode-noosphere-memory'
        run: node ../vendor/toml5-candidate/public-consumers.mjs "$RUNNER_TEMP/adapter-package" "$RUNNER_TEMP/adapter-consumers" "${{ matrix.package.dir }}"

  publish_helper:
    needs: package-check
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v-openclaw-') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_openclaw)
    defaults:
      run:
        working-directory: noosphere-injected-memory
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: noosphere-injected-memory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate coordinated release tag
        if: startsWith(github.ref, 'refs/tags/v-openclaw-')
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const tagVersion = (process.env.GITHUB_REF_NAME ?? "").replace(/^v-openclaw-/, "");
          if (tagVersion !== pkg.version) {
            console.error(`OpenClaw release tag does not match injected-memory version ${pkg.version}`);
            process.exit(1);
          }
          NODE

      - name: Build and pack exact helper artifact
        id: pack
        run: |
          npm run build
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"
          npm pack --json --ignore-scripts > "$RUNNER_TEMP/injected-pack.json"
          filename=$(node -e 'const p=require(process.argv[1]); process.stdout.write(p[0].filename)' "$RUNNER_TEMP/injected-pack.json")
          integrity=$(node -e 'const p=require(process.argv[1]); process.stdout.write(p[0].integrity)' "$RUNNER_TEMP/injected-pack.json")
          test -f "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      - name: Publish helper or verify exact prior publication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          LOCAL_INTEGRITY: ${{ steps.pack.outputs.integrity }}
          TARBALL: ${{ steps.pack.outputs.filename }}
        run: |
          package=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          bash "$GITHUB_WORKSPACE/scripts/publish-npm-artifact.sh" \
            "$TARBALL" "${package}@${version}" "$LOCAL_INTEGRITY"

  publish_openclaw:
    needs: [package-check, publish_helper]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v-openclaw-') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_openclaw)
    defaults:
      run:
        working-directory: openclaw-noosphere-memory
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: openclaw-noosphere-memory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate package metadata
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const lockVersion = lock.packages?.[""]?.version ?? lock.version;

          if (lockVersion !== pkg.version) {
            console.error(
              `package-lock.json version (${lockVersion}) does not match package.json version (${pkg.version})`
            );
            process.exit(1);
          }
          NODE

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v-openclaw-')
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME ?? "";
          const tagVersion = tag.replace(/^v-openclaw-/, "");

          if (tagVersion !== pkg.version) {
            console.error(
              `Release tag ${tag} does not match package.json version ${pkg.version}`
            );
            process.exit(1);
          }
          NODE

      - name: Build package
        run: npm run build

      - name: Verify committed dist is current
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"

      - name: Pack exact OpenClaw artifact
        id: pack
        run: |
          npm pack --json --ignore-scripts > "$RUNNER_TEMP/openclaw-pack.json"
          filename=$(node -e 'const p=require(process.argv[1]); process.stdout.write(p[0].filename)' "$RUNNER_TEMP/openclaw-pack.json")
          integrity=$(node -e 'const p=require(process.argv[1]); process.stdout.write(p[0].integrity)' "$RUNNER_TEMP/openclaw-pack.json")
          test -f "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      - name: Publish OpenClaw or verify exact prior publication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          LOCAL_INTEGRITY: ${{ steps.pack.outputs.integrity }}
          TARBALL: ${{ steps.pack.outputs.filename }}
        run: |
          package=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          bash "$GITHUB_WORKSPACE/scripts/publish-npm-artifact.sh" \
            "$TARBALL" "${package}@${version}" "$LOCAL_INTEGRITY"

  publish_opencode:
    needs: package-check
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v-opencode-') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_opencode)
    defaults:
      run:
        working-directory: opencode-noosphere-memory
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: opencode-noosphere-memory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate package metadata
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const lockVersion = lock.packages?.[""]?.version ?? lock.version;

          if (lockVersion !== pkg.version) {
            console.error(
              `package-lock.json version (${lockVersion}) does not match package.json version (${pkg.version})`
            );
            process.exit(1);
          }
          NODE

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v-opencode-')
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME ?? "";
          const tagVersion = tag.replace(/^v-opencode-/, "");

          if (tagVersion !== pkg.version) {
            console.error(
              `Release tag ${tag} does not match package.json version ${pkg.version}`
            );
            process.exit(1);
          }
          NODE

      - name: Build package
        run: npm run build

      - name: Verify committed dist is current
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"

      - name: Pack adapter with the bundled private client
        id: pack
        run: |
          node ../vendor/toml5-candidate/pack-adapter.mjs "$PWD" "$RUNNER_TEMP/opencode-package" > "$RUNNER_TEMP/opencode-pack.json"
          filename=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).archive' "$RUNNER_TEMP/opencode-pack.json")
          integrity=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).integrity' "$RUNNER_TEMP/opencode-pack.json")
          test -f "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      - name: Qualify the exact tarball to publish
        run: node ../vendor/toml5-candidate/public-consumers.mjs "$RUNNER_TEMP/opencode-package" "$RUNNER_TEMP/opencode-consumers" opencode-noosphere-memory

      - name: Publish packed artifact or verify exact prior publication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          LOCAL_INTEGRITY: ${{ steps.pack.outputs.integrity }}
          TARBALL: ${{ steps.pack.outputs.filename }}
        run: |
          package=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          bash "$GITHUB_WORKSPACE/scripts/publish-npm-artifact.sh" \
            "$TARBALL" "${package}@${version}" "$LOCAL_INTEGRITY"

  publish_kilocode:
    needs: package-check
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v-kilocode-') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_kilocode)
    defaults:
      run:
        working-directory: kilocode-noosphere-memory
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: kilocode-noosphere-memory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate package metadata
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const lockVersion = lock.packages?.[""]?.version ?? lock.version;

          if (lockVersion !== pkg.version) {
            console.error(
              `package-lock.json version (${lockVersion}) does not match package.json version (${pkg.version})`
            );
            process.exit(1);
          }
          NODE

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v-kilocode-')
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME ?? "";
          const tagVersion = tag.replace(/^v-kilocode-/, "");

          if (tagVersion !== pkg.version) {
            console.error(
              `Release tag ${tag} does not match package.json version ${pkg.version}`
            );
            process.exit(1);
          }
