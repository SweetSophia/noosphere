      - name: Build package
        run: npm run build

      - name: Verify committed dist is current
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"

      - name: Pack adapter with the bundled private client
        id: pack
        run: |
          node ../vendor/toml5-candidate/pack-adapter.mjs "$PWD" "$RUNNER_TEMP/kilocode-package" > "$RUNNER_TEMP/kilocode-pack.json"
          filename=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).archive' "$RUNNER_TEMP/kilocode-pack.json")
          integrity=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).integrity' "$RUNNER_TEMP/kilocode-pack.json")
          test -f "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
