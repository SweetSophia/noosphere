name: Publish Noosphere plugins to npm

on:
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/npm-publish.yml"
      - "VERSION"
      - "scripts/check-package-policies.mjs"
      - "scripts/sync-version.mjs"
      - "package.json"
      - "package-lock.json"
      - "install-openclaw.sh"
      - "docker-compose.noosphere.yml"
      - "README.md"
      - "docs/OPENCLAW*.md"
      - "hermes-noosphere-memory/plugins/memory/noosphere/plugin.yaml"
      - "noosphere-injected-memory/**"
      - "openclaw-noosphere-memory/**"
      - "opencode-noosphere-memory/**"
      - "kilocode-noosphere-memory/**"
  push:
    tags: ["v-openclaw-*", "v-opencode-*", "v-kilocode-*"]
  workflow_dispatch:
    inputs:
      publish_openclaw:
        description: "Publish the OpenClaw plugin (@sweetsophia/openclaw-noosphere-memory) to npm"
        required: true
        type: boolean
        default: false
      publish_opencode:
        description: "Publish the Opencode plugin (@sweetsophia/opencode-noosphere-memory) to npm"
        required: true
        type: boolean
        default: false
      publish_kilocode:
        description: "Publish the Kilo Code plugin (@sweetsophia/kilocode-noosphere-memory) to npm"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  package-check:
    strategy:
      fail-fast: false
      matrix:
        package:
          - dir: noosphere-injected-memory
            name: "@sweetsophia/noosphere-injected-memory"
          - dir: openclaw-noosphere-memory
            name: "@sweetsophia/openclaw-noosphere-memory"
          - dir: opencode-noosphere-memory
            name: "@sweetsophia/opencode-noosphere-memory"
          - dir: kilocode-noosphere-memory
            name: "@sweetsophia/kilocode-noosphere-memory"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ${{ matrix.package.dir }}/package-lock.json

      - name: Validate release version metadata
        working-directory: .
        run: npm run version:check

      - name: Validate package publishing policy
        working-directory: .
        run: npm run package-policy:check

      - name: Install dependencies
        run: npm ci

      - name: Validate package metadata
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const lockVersion = lock.packages?.[""]?.version ?? lock.version;

          if (lockVersion !== pkg.version) {
            console.error(
              `package-lock.json version (${lockVersion}) does not match package.json version (${pkg.version})`
            );
            process.exit(1);
          }
          NODE

      - name: Type-check
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Verify committed dist is current
        run: git diff --exit-code -- dist

      - name: Pack dry run
        run: npm pack --dry-run

  publish_helper:
    needs: package-check
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v-openclaw-') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_openclaw)
    defaults:
      run:
        working-directory: noosphere-injected-memory
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: noosphere-injected-memory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate coordinated release tag
        if: startsWith(github.ref, 'refs/tags/v-openclaw-')
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const tagVersion = (process.env.GITHUB_REF_NAME ?? "").replace(/^v-openclaw-/, "");
          if (tagVersion !== pkg.version) {
            console.error(`OpenClaw release tag does not match injected-memory version ${pkg.version}`);
            process.exit(1);
          }
          NODE

      - name: Build and pack exact helper artifact
        id: pack
        run: |
          npm run build
          git diff --exit-code -- dist
          npm pack --json > "$RUNNER_TEMP/injected-pack.json"
          filename=$(node -e 'const p=require(process.argv[1]); process.stdout.write(p[0].filename)' "$RUNNER_TEMP/injected-pack.json")
          integrity=$(node -e 'const p=require(process.argv[1]); process.stdout.write(p[0].integrity)' "$RUNNER_TEMP/injected-pack.json")
          test -f "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      - name: Publish helper or verify exact prior publication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          LOCAL_INTEGRITY: ${{ steps.pack.outputs.integrity }}
          TARBALL: ${{ steps.pack.outputs.filename }}
        run: |
          package=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          remote_json=$(npm view "${package}@${version}" dist.integrity --json 2>/dev/null || true)
          remote_integrity=$(node -e 'try { const value=JSON.parse(process.argv[1]); if (typeof value === "string") process.stdout.write(value); } catch {}' "$remote_json")
          if [[ -n "$remote_integrity" ]]; then
            if [[ "$remote_integrity" != "$LOCAL_INTEGRITY" ]]; then
              printf 'Existing %s@%s integrity does not match this release artifact.\n' "$package" "$version" >&2
              exit 1
            fi
            printf '%s@%s is already published with matching integrity; continuing.\n' "$package" "$version"
          else
            npm publish "$TARBALL" --access public --provenance
          fi
          published_integrity=
          for attempt in {1..10}; do
            published_json=$(npm view "${package}@${version}" dist.integrity --json 2>/dev/null || true)
            published_integrity=$(node -e 'try { const value=JSON.parse(process.argv[1]); if (typeof value === "string") process.stdout.write(value); } catch {}' "$published_json")
            if [[ "$published_integrity" == "$LOCAL_INTEGRITY" ]]; then
              break
            fi
            if [[ -n "$published_integrity" ]]; then
              printf 'Readback integrity for %s@%s does not match this release artifact.\n' "$package" "$version" >&2
              exit 1
            fi
            sleep 3
          done
          test "$published_integrity" = "$LOCAL_INTEGRITY"

  publish_openclaw:
    needs: [package-check, publish_helper]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v-openclaw-') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_openclaw)
    defaults:
      run:
        working-directory: openclaw-noosphere-memory
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: openclaw-noosphere-memory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate package metadata
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const lockVersion = lock.packages?.[""]?.version ?? lock.version;

          if (lockVersion !== pkg.version) {
            console.error(
              `package-lock.json version (${lockVersion}) does not match package.json version (${pkg.version})`
            );
            process.exit(1);
          }
          NODE

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v-openclaw-')
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME ?? "";
          const tagVersion = tag.replace(/^v-openclaw-/, "");

          if (tagVersion !== pkg.version) {
            console.error(
              `Release tag ${tag} does not match package.json version ${pkg.version}`
            );
            process.exit(1);
          }
          NODE

      - name: Build package
        run: npm run build

      - name: Verify committed dist is current
        run: git diff --exit-code -- dist

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  publish_opencode:
    needs: package-check
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v-opencode-') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_opencode)
    defaults:
      run:
        working-directory: opencode-noosphere-memory
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: opencode-noosphere-memory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate package metadata
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const lockVersion = lock.packages?.[""]?.version ?? lock.version;

          if (lockVersion !== pkg.version) {
            console.error(
              `package-lock.json version (${lockVersion}) does not match package.json version (${pkg.version})`
            );
            process.exit(1);
          }
          NODE

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v-opencode-')
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME ?? "";
          const tagVersion = tag.replace(/^v-opencode-/, "");

          if (tagVersion !== pkg.version) {
            console.error(
              `Release tag ${tag} does not match package.json version ${pkg.version}`
            );
            process.exit(1);
          }
          NODE

      - name: Build package
        run: npm run build

      - name: Verify committed dist is current
        run: git diff --exit-code -- dist

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  publish_kilocode:
    needs: package-check
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v-kilocode-') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_kilocode)
    defaults:
      run:
        working-directory: kilocode-noosphere-memory
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: kilocode-noosphere-memory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate package metadata
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const lockVersion = lock.packages?.[""]?.version ?? lock.version;

          if (lockVersion !== pkg.version) {
            console.error(
              `package-lock.json version (${lockVersion}) does not match package.json version (${pkg.version})`
            );
            process.exit(1);
          }
          NODE

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v-kilocode-')
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME ?? "";
          const tagVersion = tag.replace(/^v-kilocode-/, "");

          if (tagVersion !== pkg.version) {
            console.error(
              `Release tag ${tag} does not match package.json version ${pkg.version}`
            );
            process.exit(1);
          }
          NODE

      - name: Build package
        run: npm run build

      - name: Verify committed dist is current
        run: git diff --exit-code -- dist

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
