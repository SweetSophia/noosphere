          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME ?? "";
          const tagVersion = tag.replace(/^v-mcp-/, "");

          if (tagVersion !== pkg.version) {
            console.error(
              `Release tag ${tag} does not match package.json version ${pkg.version}`
            );
            process.exit(1);
          }
          NODE

      - name: Test package
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify committed dist is current
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"

      - name: Pack exact MCP artifact
        id: pack
        run: |
          npm pack --json --ignore-scripts > "$RUNNER_TEMP/mcp-pack.json"
          filename=$(node -e 'const p=require(process.argv[1]); process.stdout.write((Array.isArray(p) ? p[0] : Object.values(p)[0]).filename)' "$RUNNER_TEMP/mcp-pack.json")
          integrity=$(node -e 'const p=require(process.argv[1]); process.stdout.write((Array.isArray(p) ? p[0] : Object.values(p)[0]).integrity)' "$RUNNER_TEMP/mcp-pack.json")
          test -f "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      - name: Publish packed artifact or verify exact prior publication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          LOCAL_INTEGRITY: ${{ steps.pack.outputs.integrity }}
          TARBALL: ${{ steps.pack.outputs.filename }}
        run: |
          package=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          bash "$GITHUB_WORKSPACE/scripts/publish-npm-artifact.sh" \
            "$TARBALL" "${package}@${version}" "$LOCAL_INTEGRITY"
