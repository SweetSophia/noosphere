      - name: Qualify the exact tarball to publish
        run: node ../vendor/toml5-candidate/public-consumers.mjs "$RUNNER_TEMP/kilocode-package" "$RUNNER_TEMP/kilocode-consumers" kilocode-noosphere-memory

      - name: Publish packed artifact or verify exact prior publication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          LOCAL_INTEGRITY: ${{ steps.pack.outputs.integrity }}
          TARBALL: ${{ steps.pack.outputs.filename }}
        run: |
          package=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          bash "$GITHUB_WORKSPACE/scripts/publish-npm-artifact.sh" \
            "$TARBALL" "${package}@${version}" "$LOCAL_INTEGRITY"

  publish_mcp:
    needs: package-check
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v-mcp-') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.publish_mcp)
    concurrency:
      group: npm-publish-noosphere-mcp
      cancel-in-progress: false
    defaults:
      run:
        working-directory: noosphere-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
