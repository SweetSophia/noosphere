name: Qualify inactive TOML candidate

on:
  pull_request:
    paths:
      - "vendor/toml5-candidate/**"
      - ".github/workflows/toml-candidate.yml"
      - "opencode-noosphere-memory/**"
      - "kilocode-noosphere-memory/**"
      - "noosphere-client/**"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Reconstruct and qualify installed candidate consumers
        run: node vendor/toml5-candidate/qualify.mjs "$RUNNER_TEMP/toml-candidate"

  application-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://localhost:5432/unused
      - run: npm run lint
      - run: npm run typecheck -- --incremental false
