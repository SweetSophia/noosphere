name: Publish Noosphere Docker image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "next.config.ts"
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "VERSION"
      - "docker-compose.yml"
      - "docker/**"
      - "!docker/postgres-pgvector/**"
      - "scripts/sync-version.mjs"
      - "noosphere-injected-memory/**"
      - "openclaw-noosphere-memory/**"
  pull_request:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "next.config.ts"
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "VERSION"
      - "docker-compose.yml"
      - "docker/**"
      - "!docker/postgres-pgvector/**"
      - "scripts/sync-version.mjs"
      - "noosphere-injected-memory/**"
      - "openclaw-noosphere-memory/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  QEMU_IMAGE: tonistiigi/binfmt:qemu-v9.2.0@sha256:ea2f0dd74e74f101df59f9a6b31d0960994060c7982a921cbceecee0f1841125

jobs:
  docker:
    runs-on: ubuntu-latest
    # The coordinated application tag publishes the image. Plugin tags publish
    # their own artifacts and must not trigger redundant image builds.
    if: "!startsWith(github.ref, 'refs/tags/v-openclaw-') && !startsWith(github.ref, 'refs/tags/v-opencode-') && !startsWith(github.ref, 'refs/tags/v-kilocode-') && !startsWith(github.ref, 'refs/tags/v-hermes-')"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Validate version metadata
        run: |
          npm run version:check
          version=$(cat VERSION)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            printf 'Application release tag %s does not match VERSION=%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          echo "NOOSPHERE_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Verify shared injected-memory dist is current
        run: |
          cd noosphere-injected-memory
          npm ci
          npm run build
          git diff --exit-code -- dist

      - name: Verify OpenClaw plugin dist is current
        run: |
          cd openclaw-noosphere-memory
          npm ci
          npm run build
          git diff --exit-code -- dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/noosphere
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          build-args: |
            # Note: prisma generate doesn't need a real database connection,
            # just a valid-format URL. Runtime DATABASE_URL comes from docker-compose env.
            DATABASE_URL=postgresql://placeholder@localhost/placeholder
            NOOSPHERE_VERSION=${{ env.NOOSPHERE_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
