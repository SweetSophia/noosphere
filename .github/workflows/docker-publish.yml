name: Publish Noosphere Docker image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - ".github/workflows/docker-publish.yml"
      - "Dockerfile"
      - "next.config.ts"
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "VERSION"
      - "docker-compose.yml"
      - "docker/**"
      - "!docker/postgres-pgvector/**"
      - "scripts/check-package-policies.mjs"
      - "scripts/sync-version.mjs"
      - "noosphere-injected-memory/**"
      - "openclaw-noosphere-memory/**"
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/docker-publish.yml"
      - "Dockerfile"
      - "next.config.ts"
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "VERSION"
      - "docker-compose.yml"
      - "docker/**"
      - "!docker/postgres-pgvector/**"
      - "scripts/check-package-policies.mjs"
      - "scripts/sync-version.mjs"
      - "noosphere-injected-memory/**"
      - "openclaw-noosphere-memory/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/sweetsophia/noosphere

jobs:
  validate:
    name: docker-validate
    runs-on: ubuntu-latest
    # The coordinated application tag publishes the image. Plugin tags publish
    # their own artifacts and must not trigger redundant image builds.
    if: "!startsWith(github.ref, 'refs/tags/v-openclaw-') && !startsWith(github.ref, 'refs/tags/v-opencode-') && !startsWith(github.ref, 'refs/tags/v-kilocode-') && !startsWith(github.ref, 'refs/tags/v-hermes-')"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Validate version metadata
        id: version
        run: |
          npm run version:check
          version=$(cat VERSION)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            printf 'Application release tag %s does not match VERSION=%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Verify shared injected-memory dist is current
        run: |
          cd noosphere-injected-memory
          npm ci
          npm run build
          git diff --exit-code -- dist

      - name: Verify OpenClaw plugin dist is current
        run: |
          cd openclaw-noosphere-memory
          npm ci
          npm run build
          git diff --exit-code -- dist

  docker-platform:
    name: docker-platform (${{ matrix.slug }})
    if: github.ref_type != 'tag'
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build target platform for validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          build-args: |
            # Prisma generation needs a valid-format URL, not a live database.
            # Runtime DATABASE_URL comes from docker-compose environment state.
            DATABASE_URL=postgresql://placeholder@localhost/placeholder
            NOOSPHERE_VERSION=${{ needs.validate.outputs.version }}
          tags: noosphere:pr-${{ matrix.slug }}

      - name: Verify local image architecture
        run: |
          architecture=$(docker image inspect noosphere:pr-${{ matrix.slug }} --format '{{.Architecture}}')
          test "$architecture" = '${{ matrix.slug }}'

  publish-platform:
    name: docker-publish-platform (${{ matrix.slug }})
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push target platform by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          build-args: |
            DATABASE_URL=postgresql://placeholder@localhost/placeholder
            NOOSPHERE_VERSION=${{ needs.validate.outputs.version }}
          labels: org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - name: Export platform digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noosphere-digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-index:
    name: docker-publish-index
    if: github.ref_type == 'tag'
    needs: [validate, publish-platform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: noosphere-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Assemble and verify multi-platform image
        run: |
          sources=()
          for digest_path in /tmp/digests/*; do
            sources+=("${REGISTRY_IMAGE}@sha256:$(basename "$digest_path")")
          done
          if [[ ${#sources[@]} -ne 2 ]]; then
            printf 'expected two platform digests, found %s\n' "${#sources[@]}" >&2
            exit 1
          fi
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${sources[@]}"
          release_ref=$(jq -er '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect --raw "$release_ref" > /tmp/release-index.json
          jq -e '
            [.manifests[]
              | select(.platform.os == "linux")
              | "\(.platform.os)/\(.platform.architecture)"]
            | sort == ["linux/amd64", "linux/arm64"]
          ' /tmp/release-index.json

  docker:
    name: docker
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/v-openclaw-') && !startsWith(github.ref, 'refs/tags/v-opencode-') && !startsWith(github.ref, 'refs/tags/v-kilocode-') && !startsWith(github.ref, 'refs/tags/v-hermes-') }}
    needs: [validate, docker-platform, publish-platform, publish-index]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every applicable Docker gate
        run: |
          test '${{ needs.validate.result }}' = success
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test '${{ needs['docker-platform'].result }}' = skipped
            test '${{ needs['publish-platform'].result }}' = success
            test '${{ needs['publish-index'].result }}' = success
          else
            test '${{ needs['docker-platform'].result }}' = success
            test '${{ needs['publish-platform'].result }}' = skipped
            test '${{ needs['publish-index'].result }}' = skipped
          fi
