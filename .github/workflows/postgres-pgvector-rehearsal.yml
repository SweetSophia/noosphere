name: Rehearse PostgreSQL pgvector volume upgrade

on:
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/postgres-pgvector-rehearsal.yml"
      - "docker/migrate-or-baseline.mjs"
      - "docker-compose.yml"
      - "docker-compose.noosphere.yml"
      - "docker/postgres-pgvector/rehearsal-*"
      - "docker/postgres-pgvector/rehearsal.env"
      - "install-openclaw.sh"
      - "package.json"
      - "package-lock.json"
      - "prisma.config.ts"
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
      - "scripts/rehearse-pgvector-volume-upgrade.sh"
      - "scripts/check-postgres-image-policy.mjs"
      - "scripts/run-pgvector-transition-controller.sh"
      - "scripts/switch-pgvector-compose.sh"
      - "scripts/test-digest-order-independence.sh"
      - "scripts/test-pgvector-compose-switch.sh"
      - "scripts/test-pgvector-transition-controller.sh"
      - "scripts/test-pgvector-transition-controller-systemd.sh"
      - "scripts/test-pgvector-transition-controller-docker.sh"
      - "scripts/verify-deploy.sh"
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/postgres-pgvector-rehearsal.yml"
      - "docker/migrate-or-baseline.mjs"
      - "docker-compose.yml"
      - "docker-compose.noosphere.yml"
      - "docker/postgres-pgvector/rehearsal-*"
      - "docker/postgres-pgvector/rehearsal.env"
      - "install-openclaw.sh"
      - "package.json"
      - "package-lock.json"
      - "prisma.config.ts"
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
      - "scripts/rehearse-pgvector-volume-upgrade.sh"
      - "scripts/check-postgres-image-policy.mjs"
      - "scripts/run-pgvector-transition-controller.sh"
      - "scripts/switch-pgvector-compose.sh"
      - "scripts/test-digest-order-independence.sh"
      - "scripts/test-pgvector-compose-switch.sh"
      - "scripts/test-pgvector-transition-controller.sh"
      - "scripts/test-pgvector-transition-controller-systemd.sh"
      - "scripts/test-pgvector-transition-controller-docker.sh"
      - "scripts/verify-deploy.sh"

permissions:
  contents: read

concurrency:
  group: postgres-pgvector-rehearsal-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QEMU_IMAGE: tonistiigi/binfmt:qemu-v9.2.0@sha256:ea2f0dd74e74f101df59f9a6b31d0960994060c7982a921cbceecee0f1841125
  BUILDX_VERSION: v0.35.0
  BUILDKIT_IMAGE: moby/buildkit:v0.26.3@sha256:5601811fde88bb9e8a577bfe804af82bccb712e1cd07ff94663bded5e628cf75

jobs:
  rehearse-volume-upgrade:
    runs-on: ubuntu-latest
    # Step budgets (30 + 10 + 35) plus checkout/tooling setup overhead exceed
    # a 60-minute ceiling on slow arm64/QEMU runs; keep the job ceiling above
    # the worst-case sequential total so it never kills a step mid-work.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
          - platform: linux/arm64
            slug: arm64
    env:
      REHEARSAL_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install pinned migration tooling
        run: npm ci

      - name: Verify immutable PostgreSQL distribution policy
        run: npm run postgres-image:check

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      # The candidate package is public. Do not authenticate before executing
      # a pull-request-controlled rehearsal script.
      - name: Rehearse volume upgrade and rollback
        timeout-minutes: 30
        run: scripts/rehearse-pgvector-volume-upgrade.sh ${{ matrix.platform }}

      - name: Test order-independent digest boundaries
        timeout-minutes: 10
        env:
          RUN_ID: gha-digest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slug }}
        run: scripts/test-digest-order-independence.sh ${{ matrix.platform }}

      - name: Test guarded Compose switch and interrupted-run recovery
        timeout-minutes: 35
        env:
          PGVECTOR_SWITCH_TEST_RUN_ID: gha-switch-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slug }}
        run: scripts/test-pgvector-compose-switch.sh ${{ matrix.platform }}

      # EXIT/INT/TERM cleanup cannot run after SIGKILL. This separately
      # invoked, exact-run cleanup still executes after a killed script step
      # while the hosted runner remains available.
      - name: Remove exact-run rehearsal resources
        if: always()
        run: |
          if [[ -x scripts/rehearse-pgvector-volume-upgrade.sh ]]; then
            scripts/rehearse-pgvector-volume-upgrade.sh --cleanup-run "$REHEARSAL_RUN_ID"
          fi

  test-transition-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install pinned Node in controller bootstrap path
        run: |
          node_path=$(command -v node)
          [[ "$node_path" == /* && -f "$node_path" ]]
          sudo install -o root -g root -m 0755 "$node_path" /usr/bin/node
          cmp -s "$node_path" /usr/bin/node
          sudo chmod 0755 /usr/local/bin
          [[ $(stat -c '%u:%a' /usr/local/bin) == 0:755 ]]

      - name: Start persistent user manager
        run: |
          runtime_dir="/run/user/$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          for _ in $(seq 1 100); do
            [[ -S "$runtime_dir/bus" ]] && break
            sleep 0.1
          done
          [[ -S "$runtime_dir/bus" ]]
          {
            printf 'XDG_RUNTIME_DIR=%s\n' "$runtime_dir"
            printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' "$runtime_dir"
          } >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime_dir" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus" \
            systemctl --user show-environment >/dev/null
          [[ $(loginctl show-user "$(id -u)" -p Linger --value) == yes ]]

      - name: Run focused transition-controller fixture
        timeout-minutes: 25
        run: scripts/test-pgvector-transition-controller.sh

      - name: Disable CI user linger
        if: always()
        run: sudo loginctl disable-linger "$USER"

  rehearse-transition-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install pinned Node in controller bootstrap path
        run: |
          node_path=$(command -v node)
          [[ "$node_path" == /* && -f "$node_path" ]]
          sudo install -o root -g root -m 0755 "$node_path" /usr/bin/node
          cmp -s "$node_path" /usr/bin/node
          sudo chmod 0755 /usr/local/bin
          [[ $(stat -c '%u:%a' /usr/local/bin) == 0:755 ]]

      - name: Start persistent user manager
        run: |
          runtime_dir="/run/user/$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          for _ in $(seq 1 100); do
            [[ -S "$runtime_dir/bus" ]] && break
            sleep 0.1
          done
          [[ -S "$runtime_dir/bus" ]]
          {
            printf 'XDG_RUNTIME_DIR=%s\n' "$runtime_dir"
            printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' "$runtime_dir"
          } >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime_dir" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus" \
            systemctl --user show-environment >/dev/null
          [[ $(loginctl show-user "$(id -u)" -p Linger --value) == yes ]]

      - name: Pull pinned controller rehearsal images
        run: |
          mapfile -t images < <(
            sed -nE "s/^(SOURCE_IMAGE|CANDIDATE_IMAGE)='([^']+)'$/\2/p" \
              scripts/test-pgvector-transition-controller-docker.sh
          )
          [[ ${#images[@]} -eq 2 ]]
          for image in "${images[@]}"; do
            [[ "$image" =~ ^[^[:space:]]+@sha256:[0-9a-f]{64}$ ]]
            docker pull --platform linux/amd64 "$image"
          done

      - name: Run pinned-Docker interruption and recovery rehearsal
        timeout-minutes: 35
        run: scripts/test-pgvector-transition-controller-docker.sh linux/amd64

      - name: Disable CI user linger
        if: always()
        run: sudo loginctl disable-linger "$USER"
